<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국립스포츠박물관 개관 이벤트 종료 안내</title>
<meta name="description" content="먼저 만나는 국립스포츠박물관 개관 이벤트(2026.10.10~10.14)는 종료되었습니다. 국립스포츠박물관은 10월 15일 정식 개관했습니다.">
<meta name="robots" content="noindex">
<meta property="og:title" content="국립스포츠박물관 개관 이벤트 종료 안내">
<meta property="og:description" content="개관 이벤트는 종료되었습니다. 많은 관심 감사합니다.">
<meta property="og:image" content="assets/exterior.webp">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
:root{--navy:#1E3A6E;--navy-deep:#14284F;--blue:#0C5A9C;--red:#E22A2D;--orange:#D9732B;--yellow:#FFD43B;--cream:#FFF9E6;--ink:#1B2E57;--sub:#55617A;--display:'Black Han Sans',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#DCEFF8;-webkit-text-size-adjust:100%}
body{font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;color:var(--ink);word-break:keep-all}
a{text-decoration:none;color:inherit}
.page{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--cream);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(27,46,87,.12)}
.hdr{display:flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(255,255,255,.94);border-bottom:1px solid #E3ECF3}
.hdr img{width:40px;height:40px;object-fit:cover;object-position:center 30%}
.hdr b{display:block;font-size:15px;font-weight:800;color:#111;line-height:1.15}
.hdr small{display:block;font-size:10px;font-weight:600;letter-spacing:.04em;color:#5A6B87}
.main{flex:1;padding:36px 20px 40px;text-align:center;background:linear-gradient(180deg,#CBE7F5 0%,#EAF5FB 40%,var(--cream) 100%)}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--navy);color:#fff;font-size:13px;font-weight:800;letter-spacing:.06em}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,9.5vw,42px);line-height:1.15;color:var(--navy);margin:16px 0 10px}
h1 em{font-style:normal;color:var(--red)}
.lead{font-size:15px;line-height:1.6;color:var(--sub);margin:0 auto;max-width:330px}
.tiger{width:min(68%,260px);display:block;margin:22px auto 0}
.card{margin:22px auto 0;padding:18px 18px 16px;border-radius:18px;background:#fff;border:2px solid var(--navy);text-align:left;max-width:380px}
.card b{display:block;font-size:17px;font-weight:800;color:var(--navy)}
.card p{margin:6px 0 0;font-size:14px;line-height:1.6;color:var(--sub)}
.card p strong{color:var(--ink);font-weight:800}
.btns{display:flex;flex-direction:column;gap:10px;margin:18px auto 0;max-width:380px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;font-size:16px;font-weight:800;color:#fff}
.btn-navy{background:var(--navy)}
.btn-insta{background:linear-gradient(45deg,#F58529 0%,#DD2A7B 50%,#8134AF 100%)}
.btn:hover{filter:brightness(1.06)}
.ftr{padding:24px 20px 32px;background:var(--navy-deep);color:#BFD3EA;text-align:center;font-size:12px;line-height:1.6}
.ftr img{width:72px;height:72px;filter:invert(1);mix-blend-mode:screen;display:block;margin:0 auto 10px}
</style>
</head>
<body>
<div class="page">
  <header class="hdr">
    <img src="assets/logo.jpg" alt="국립스포츠박물관">
    <span><b>국립스포츠박물관</b><small>NATIONAL SPORTS MUSEUM OF KOREA</small></span>
  </header>

  <main class="main">
    <span class="badge">EVENT CLOSED</span>
    <h1>개관 이벤트가<br><em>종료</em>되었습니다</h1>
    <p class="lead">"먼저 만나는 국립스포츠박물관" 시범운영 이벤트(2026.10.10~10.14)에 함께해 주셔서 감사합니다.</p>
    <img class="tiger" src="assets/tiger-binocular.png" alt="망원경을 든 호랑이 캐릭터">

    <div class="card">
      <b>국립스포츠박물관은 정식 개관했습니다</b>
      <p><strong>2026년 10월 15일(목)</strong> 개관 · 서울 송파구 올림픽로 424 올림픽공원 내<br>관람 시간과 휴관일 등 자세한 안내는 공식 홈페이지를 확인해 주세요.</p>
    </div>

    <div class="btns">
      <a class="btn btn-navy" href="https://sportsmuseum.kspo.or.kr/" target="_blank" rel="noopener">공식 홈페이지 바로가기</a>
      <a class="btn btn-insta" href="https://www.instagram.com/national.sports.museum/" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1.1" fill="currentColor" stroke="none"/></svg>
        인스타그램 바로가기
      </a>
    </div>
  </main>

  <footer class="ftr">
    <img src="assets/logo.jpg" alt="">
    © 국립스포츠박물관 · 서울 송파구 올림픽로 424
  </footer>
</div>
</body>
</html>
